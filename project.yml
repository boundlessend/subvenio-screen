name: ScreenFilter
options:
  bundleIdPrefix: dev.senya
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  # запись комбинаций в UI и проверка конфликтов из коробки, под капотом тот же Carbon,
  # Accessibility не требует
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  ScreenFilter:
    type: application
    platform: macOS
    dependencies:
      - package: KeyboardShortcuts
    sources:
      - Sources
      # folder reference: пресеты попадают в бандл со своей структурой папок
      - path: Resources/Shaders
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senya.ScreenFilter
        PRODUCT_NAME: ScreenFilter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        # настоящая подпись, а не ad-hoc: разрешение Screen Recording в TCC привязано
        # к team id и bundle id, поэтому переживает пересборку
        CODE_SIGN_IDENTITY: 50DE49C2D301E0833C23C99465E11835AC1028F7
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: WN472X65XN
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ARCHS: "$(ARCHS_STANDARD)"
