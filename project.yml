name: ScreenFilter
options:
  bundleIdPrefix: dev.senya
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

# исходный язык интерфейса английский, русский лежит переводом в Localizable.xcstrings
fileGroups:
  - Resources/Localizable.xcstrings
  - Signing.xcconfig

packages:
  # запись комбинаций в UI и проверка конфликтов из коробки, под капотом тот же Carbon,
  # Accessibility не требует. версия точная: Package.resolved лежит внутри .xcodeproj,
  # который не в git, и сам по себе сборку не зафиксирует
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0

targets:
  ScreenFilter:
    type: application
    platform: macOS
    dependencies:
      - package: KeyboardShortcuts
    sources:
      - Sources
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
      # folder reference: пресеты попадают в бандл со своей структурой папок
      - path: Resources/Shaders
        type: folder
    # подпись вынесена в xcconfig: локальные значения не должны лежать в репозитории
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senya.ScreenFilter
        PRODUCT_NAME: ScreenFilter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        # ловит гонки на границах, где уже расставлены акторы и Sendable,
        # не заваливая сборку шумом от AppKit
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ARCHS: "$(ARCHS_STANDARD)"

  ScreenFilterTests:
    type: bundle.unit-test
    platform: macOS
    # без TEST_HOST: тесты проверяют чистые преобразования, а поднятый хост
    # применил бы гамму и повесил иконку в меню-баре прямо во время прогона
    sources:
      - Tests
      - Sources/Gamma.swift
      - Sources/Logging.swift
      - Sources/ShaderPipeline.swift
      - Sources/ShaderPlugin.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScreenFilter:
    build:
      targets:
        ScreenFilter: all
        ScreenFilterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenFilterTests
    archive:
      config: Release
