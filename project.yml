name: ScreenFilter
options:
  bundleIdPrefix: dev.senya
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ScreenFilter:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senya.ScreenFilter
        PRODUCT_NAME: ScreenFilter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ARCHS: "$(ARCHS_STANDARD)"
