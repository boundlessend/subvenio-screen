# правила берутся стандартные, а выключенное ниже выключено осознанно и по одной
# причине: линтер должен ловить то, что появится дальше, а не переучивать
# уже написанное под чужой вкус. CI запускает его со --strict, поэтому
# предупреждение здесь останавливает сборку
included:
  - Sources
  - Tests

excluded:
  - build
  - dist

disabled_rules:
  # три канала гаммы это тройка по природе, а не забытая структура
  - large_tuple
  # кадр описывают восемь величин, и заворачивать их в структуру ради счётчика
  # значит распаковывать её на месте вызова
  - function_parameter_count

identifier_name:
  # x и y координаты, a и b компоненты версии: короткое имя здесь честнее длинного
  min_length: 1

# размерные пороги подняты один раз и осознанно: комментарии здесь объясняют решения,
# а не пересказывают код, и делить контроллер эффекта ради счётчика строк незачем
file_length:
  warning: 500
  ignore_comment_only_lines: true

type_body_length:
  warning: 400

# меню строится линейно, сверху вниз, и разрезание его на части ради предела
# сделало бы порядок пунктов менее очевидным, чем он есть
function_body_length:
  warning: 80

# строку интерфейса не перенести, не изменив ключ локализации, поэтому предел
# считается по коду: комментарии и интерполяция в логах из счёта выпадают
line_length:
  warning: 150
  ignores_comments: true
  ignores_interpolated_strings: true
